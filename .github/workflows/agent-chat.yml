# Rozmowa z agentem: odpowiedzi na pytania i dowolne polecenia.
# Napisz komentarz zaczynający się od @claude w issue lub PR (np. "@claude A" albo "@claude popraw nagłówek").
name: "Agent: @claude"

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  chat:
    # Komentarze botów (np. pytania agentów z instrukcją „@claude A”) nie uruchamiają rozmowy — inaczej agent odpowiadałby sam sobie.
    if: |
      github.event.sender.type != 'Bot' && (
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.AGENT_GH_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Git identity
        run: |
          git config user.name "SV Agent"
          git config user.email "agent@users.noreply.github.com"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 100
            --append-system-prompt "Stosuj CLAUDE.md. Jeśli to odpowiedź na pytanie z etykietą question: ustal z historii, którą rolę pełnił pytający agent (Analityk, Implementator, Recenzent), przeczytaj jego plik w .claude/agents/, usuń etykietę question i dokończ jego pracę. Pracuj na istniejącej gałęzi agent/issue-<n>-* i istniejącym PR, jeśli są. PR otwieraj przez gh pr create. Nigdy nie merguj."
            --allowedTools "Read,Write,Edit,MultiEdit,Glob,Grep,Bash(git:*),Bash(ls:*),Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue create:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr edit:*)"
            --disallowedTools "Bash(gh pr merge:*),Bash(git push origin main:*),Bash(git push -f:*),Bash(git push --force:*)"
