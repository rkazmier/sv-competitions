# Przebudowa strony publicznej (SPEC-001 §8, AC-31…33, ADR-0003) — tylko build + publikacja frontendu,
# bez migracji i Edge Functions.
#  - workflow_dispatch z Edge Function `site-rebuild` (input `target` = SITE_ENV projektu Supabase),
#  - codziennie w nocy dla obu środowisk: minione wpisy znikają z kalendarza.
#    22:30 i 23:30 UTC — jedno z nich to 00:30 w Polsce (czas zimowy/letni), drugie jest nieszkodliwe.
#  - produkcja buduje kod ostatniego UDANEGO wdrożenia environment `production` (deployment ze statusem
#    `success`), a nie ostatniego opublikowanego Release — Release czekający na zatwierdzenie ma migracje,
#    których nie ma jeszcze w produkcyjnej bazie (#150). Staging buduje `main`.
name: Rebuild site

on:
  workflow_dispatch:
    inputs:
      target:
        description: Środowisko
        type: choice
        options: [staging, production]
        required: true
  schedule:
    - cron: '30 22 * * *'
    - cron: '30 23 * * *'

permissions:
  contents: read

jobs:
  staging:
    if: github.event_name == 'schedule' || inputs.target == 'staging'
    # AC-31: kilka zmian w krótkim czasie — wdraża się ostatnia przebudowa.
    # Grupa celowo inna niż `deploy-staging` (patrz komentarz przy jobie production).
    concurrency:
      group: rebuild-site-staging
      cancel-in-progress: true
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        working-directory: web
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          PUBLIC_APP_ENV: staging
          PUBLIC_SITE_URL: ${{ vars.APP_URL }}
        run: |
          npm ci
          npm run build
      - name: Publikacja na stagingu
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.AGENT_GH_TOKEN }}
          external_repository: ${{ github.repository_owner }}/sv-competitions-staging
          publish_branch: gh-pages
          publish_dir: web/dist
          cname: events-staging.steel-valley.pl

  production:
    if: github.event_name == 'schedule' || inputs.target == 'production'
    # Grupa celowo inna niż `deploy-production`: wspólna grupa z `cancel-in-progress: true` pozwoliłaby
    # przebudowie anulować wdrożenie w trakcie migracji. Równoległe wdrożenie i przebudowa publikują
    # ten sam kod, więc wygrywa ostatni zapis o tej samej treści.
    concurrency:
      group: rebuild-site-production
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # Reguła środowiska github-pages musi dopuszczać gałąź `main` (owner-task #13).
    environment:
      name: github-pages
      url: https://events.steel-valley.pl
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: read
      pages: write
      id-token: write
    steps:
      # AC-32: kod ostatniego udanego wdrożenia produkcji (zatwierdzony Release), nie z `main`
      # i nie z opublikowanego, ale jeszcze niezatwierdzonego Release.
      - name: Ostatnie udane wdrożenie produkcji
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Deploymenty environment `production` (od najnowszych); bierzemy sha pierwszego, którego ostatni
          # status to `success`. Czekające na zatwierdzenie (`waiting`), w toku i nieudane są pomijane.
          # Brak udanego wdrożenia — pomijamy przebudowę z notice. Każdy błąd API przerywa job, żeby nie było
          # cichego „braku przebudowy”.
          api() {
            if ! gh api "$1" --jq "$2" 2>gh-error.txt; then
              echo "::error::Nie udało się odczytać wdrożeń produkcji: $(cat gh-error.txt)" >&2
              return 1
            fi
          }
          sha=""
          ref=""
          deployments=$(api "repos/$GITHUB_REPOSITORY/deployments?environment=production&per_page=100" \
            '.[] | "\(.id) \(.sha) \(.ref)"')
          while read -r id dsha dref; do
            [ -n "$id" ] || continue
            state=$(api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" '.[0].state // ""')
            if [ "$state" = "success" ]; then
              sha="$dsha"
              ref="$dref"
              break
            fi
          done <<< "$deployments"
          if [ -z "$sha" ]; then
            echo "::notice::Brak udanego wdrożenia produkcji — przebudowa produkcji pominięta."
          else
            echo "::notice::Przebudowa produkcji z wdrożonego kodu: $ref ($sha)."
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - if: steps.release.outputs.sha != ''
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.sha }}
      - if: steps.release.outputs.sha != ''
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        if: steps.release.outputs.sha != ''
        working-directory: web
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          PUBLIC_APP_ENV: production
          PUBLIC_SITE_URL: ${{ vars.APP_URL }}
        run: |
          npm ci
          npm run build
      - if: steps.release.outputs.sha != ''
        uses: actions/configure-pages@v5
      - if: steps.release.outputs.sha != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        if: steps.release.outputs.sha != ''
        uses: actions/deploy-pages@v4
